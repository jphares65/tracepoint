version: 0.2

env:
  shell: bash

phases:
  pre_build:
    on-failure: ABORT
    commands:
      - set +x
      - test "$AWS_ACCOUNT_ID" = "193644343389"
      - test "$(aws sts get-caller-identity --query Account --output text)" = "$AWS_ACCOUNT_ID"
      - test "$AWS_DEFAULT_REGION" = "us-east-1"
      - test "$CONFIGURATION_ENVIRONMENT" = "production"
      - test "$TRACEPOINT_BUILD_PROVIDER_MODE" = "aws-native-shadow"
      - test "$IMAGE_TAG" = "$SOURCE_COMMIT"
      - echo "$SOURCE_COMMIT" | grep -Eq '^[0-9a-f]{40}$'
      - echo "$NEXT_PUBLIC_SITE_URL" | grep -Eq '^https://shadow(-[a-z0-9-]+)?\.tracepointhq\.com$'
      - test -z "${NEXT_PUBLIC_SUPABASE_URL:-}"
      - test -z "${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}"
      - test -n "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
  build:
    on-failure: ABORT
    commands:
      - set +x
      - docker build --pull -f Dockerfile.shadow --secret id=next_server_actions_encryption_key,env=NEXT_SERVER_ACTIONS_ENCRYPTION_KEY --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" --build-arg DEPLOYMENT_VERSION="$SOURCE_COMMIT" --label org.opencontainers.image.revision="$SOURCE_COMMIT" --label tracepoint.runtime=aws-native-shadow -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" .
      - docker inspect "$ECR_REPOSITORY_URI:$IMAGE_TAG" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -Fx "$SOURCE_COMMIT"
      - docker run --rm --read-only --entrypoint /nodejs/bin/node "$ECR_REPOSITORY_URI:$IMAGE_TAG" -e 'const fs=require("node:fs");const path="/app/rds-ca.pem";fs.accessSync(path,fs.constants.R_OK);if(!fs.readFileSync(path,"utf8").includes("BEGIN CERTIFICATE"))throw Error("RDS CA missing");console.log("RDS CA readable by non-root runtime")'
      - docker run --rm --read-only --entrypoint /nodejs/bin/node "$ECR_REPOSITORY_URI:$IMAGE_TAG" -e 'const fs=require("node:fs");fs.accessSync("/app/phase3c-rehearsal-auth-fixture.cjs",fs.constants.R_OK);console.log("Fixed rehearsal fixture readable by non-root runtime")'
      - docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
  post_build:
    commands:
      - set +x
      - if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then aws ecr describe-images --repository-name tracepoint-production --image-ids imageTag="$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text; fi
