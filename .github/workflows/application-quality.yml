name: Application quality gate
on:
  pull_request:
  push:
    branches: [main, codex/staging-mobile-api-release-20261007]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: application-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix infra
      - run: node --test --test-concurrency=1 scripts/*.test.mjs
      - run: node scripts/run-application-tests.mjs
      - run: npm test --prefix infra
      - run: npx tsc --noEmit
      - run: npm run db:validate-bootstrap
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
