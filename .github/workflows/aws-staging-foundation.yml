name: AWS staging foundation

on:
  pull_request:
    paths:
      - "infra/**"
      - "scripts/**tracepoint-staging**"
      - ".github/workflows/aws-staging-foundation.yml"
  workflow_dispatch:
    inputs:
      deploy_foundations:
        description: "Deploy the reviewed staging foundation stacks"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: tracepoint-aws-staging-foundation
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "559054714699"
  CDK_ENVIRONMENT: tracepoint-staging

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Synthesize offline staging foundations
        run: >-
          npx cdk synth --strict --output cdk.out.ci
          -c account=${AWS_ACCOUNT_ID}
          -c region=${AWS_REGION}
          -c environment=${CDK_ENVIRONMENT}
          -c runtimeEnabled=false
          --lookups=false

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_foundations
    needs: validate
    runs-on: ubuntu-latest
    environment: aws-staging
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Enforce staging identity boundary
        shell: bash
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          arn="$(aws sts get-caller-identity --query Arn --output text)"
          test "$account" = "$AWS_ACCOUNT_ID"
          [[ "$arn" == *TracePointMigrationStaging* ]]
      - name: Review foundation diff
        run: >-
          npx cdk diff
          tracepoint-staging-network tracepoint-staging-security tracepoint-staging-compute
          -c account=${AWS_ACCOUNT_ID}
          -c region=${AWS_REGION}
          -c environment=${CDK_ENVIRONMENT}
          -c runtimeEnabled=false
          --lookups=false --fail
      - name: Deploy staging foundations only
        run: >-
          npx cdk deploy
          tracepoint-staging-network tracepoint-staging-security tracepoint-staging-compute
          -c account=${AWS_ACCOUNT_ID}
          -c region=${AWS_REGION}
          -c environment=${CDK_ENVIRONMENT}
          -c runtimeEnabled=false
          --lookups=false --require-approval never
