name: Renew staging database lease
on:
  workflow_dispatch:
    inputs:
      expires_after_utc:
        description: UTC expiration timestamp, more than 30 minutes and no more than 7 days from execution
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: tracepoint-staging-database-lease
  cancel-in-progress: false
jobs:
  renew:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: aws-staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '559054714699'
          role-duration-seconds: 3600
      - shell: pwsh
        env:
          LEASE_EXPIRES_AFTER_UTC: ${{ inputs.expires_after_utc }}
          LEASE_OWNER: github-${{ github.actor }}
          LEASE_REFERENCE: github:${{ github.run_id }}:${{ github.run_attempt }}
        run: |
          ./scripts/renew-staging-database-lease.ps1 `
            -ExpiresAfterUtc $env:LEASE_EXPIRES_AFTER_UTC `
            -LeaseOwner $env:LEASE_OWNER `
            -LeaseReference $env:LEASE_REFERENCE `
            -Execute
