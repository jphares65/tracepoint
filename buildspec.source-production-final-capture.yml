version: 0.2

env:
  shell: bash
  variables:
    SOURCE_PRODUCTION_PROJECT_URL: "https://izlkwggluhlhzlumtzes.supabase.co"
  secrets-manager:
    SOURCE_PRODUCTION_SERVICE_KEY: "tracepoint/production/migration/source-production-epoch-capture-20260928"

phases:
  install:
    on-failure: ABORT
    commands:
      - set +x
      - npm ci --omit=dev --ignore-scripts --no-audit --no-fund
  pre_build:
    on-failure: ABORT
    commands:
      - set +x
      - test "$(aws sts get-caller-identity --query Account --output text)" = "193644343389"
      - test "$AWS_DEFAULT_REGION" = "us-east-1"
      - test "$TRACEPOINT_EXPECTED_AWS_ACCOUNT" = "193644343389"
      - test "$TRACEPOINT_SOURCE_PRODUCTION_PROJECT_REF" = "izlkwggluhlhzlumtzes"
      - test "$SOURCE_PRODUCTION_PROJECT_URL" = "https://izlkwggluhlhzlumtzes.supabase.co"
      - echo "$TRACEPOINT_SOURCE_PRODUCTION_RUN_ID" | grep -Eq '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      - test "$TRACEPOINT_SOURCE_PRODUCTION_CAPTURE_SLOT" = "A" -o "$TRACEPOINT_SOURCE_PRODUCTION_CAPTURE_SLOT" = "B"
      - echo "$TRACEPOINT_COMPOSITE_FENCE_VERSION_ID" | grep -Eq '^[A-Za-z0-9._-]+$'
      - echo "$TRACEPOINT_COMPOSITE_FENCE_SHA256" | grep -Eq '^[0-9a-f]{64}$'
      - export SOURCE_PRODUCTION_SERVICE_KEY="$(node -e 'const name="tracepoint/production/migration/source-production-epoch-capture-20260928"; const value=JSON.parse(process.env.SOURCE_PRODUCTION_SERVICE_KEY || "null"); if (!value || Object.keys(value).length !== 1 || typeof value[name] !== "string") process.exit(1); process.stdout.write(value[name]);')"
      - echo "$SOURCE_PRODUCTION_SERVICE_KEY" | grep -Eq '^sb_secret_[A-Za-z0-9_-]{20,}$'
  build:
    on-failure: ABORT
    commands:
      - set +x
      - node scripts/run-source-production-final-capture.mjs
